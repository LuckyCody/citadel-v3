[package]
name = "citadel-cli"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Citadel V3 command-line interface — key management, diagnostics, migration, backup"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrcord77/citadel-v3"

[[bin]]
name = "citadel"
path = "src/main.rs"

[features]
default = []
# Enable Redis-backed distributed replay store (for citadel doctor diagnostics).
redis-backend = ["citadel-keystore/redis-backend"]

[dependencies]
citadel-envelope = { path = "../citadel-envelope" }
citadel-keystore  = { path = "../citadel-keystore" }
clap              = { version = "4", features = ["derive", "env"] }
tokio             = { version = "1", features = ["full"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
hex               = "0.4"
chrono            = { version = "0.4", features = ["serde"] }
sha2              = "0.10"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize           = { version = "1.7", features = ["derive"] }
