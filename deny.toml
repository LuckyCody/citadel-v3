[advisories]
version = 2
yanked = "deny"
# Policy: fail on vulnerabilities by default. For unmaintained/unsound, gate only on
# crates we DIRECTLY chose (`workspace` scope); transitively-pulled dev-tooling
# advisories are NOT hidden — they stay visible in `cargo audit` every run and
# are documented as reviewed/accepted in docs/security/SUPPLY_CHAIN.md. The 4 such advisories
# (ansi_term, atty x2, proc-macro-error2) are dev-only, have no upstream fix, never ship.
#
# TWO scoped, ID-specific exceptions (packet 058, 2026-08-04): both are advisories in the
# CMVP-VALIDATED `aws-lc-fips-sys 0.13.11` pin (AWS-LC FIPS 3.1.0, packet 051) and are
# NON-APPLICABLE to Citadel — we use AES-GCM (never AES-CCM) and do no X.509/CRL. The fixes
# exist only in the UNVALIDATED 3.4.0 build, so keeping the validated build is a deliberate,
# owner-approved trade-off. Full rationale: docs/security/SUPPLY_CHAIN.md §"FIPS module advisory exceptions".
ignore = [
    { id = "RUSTSEC-2026-0042", reason = "CRL distribution-point scope-check logic error in AWS-LC; Citadel does no X.509/CRL. Present in the validated 3.1.0 pin; fixed only in the unvalidated 3.4.0." },
    { id = "RUSTSEC-2026-0043", reason = "AES-CCM tag-verify timing side-channel in AWS-LC; Citadel uses AES-GCM, never AES-CCM. Present in the validated 3.1.0 pin; fixed only in the unvalidated 3.4.0." },
]
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]

# Scoped per-crate exceptions for the AWS-LC subtree ONLY — the global allowlist
# above is deliberately unchanged. ISC is a permissive MIT-equivalent. The OpenSSL
# license term (aws-lc-fips-sys) is accepted for the opt-in, non-default `fips`
# build only, under the additional permission in LICENSE-EXCEPTION granted by the
# copyright holder on his own code. Rationale: docs/security/SUPPLY_CHAIN.md §AWS-LC.
[[licenses.exceptions]]
name = "aws-lc-rs"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-fips-sys"
allow = ["ISC", "OpenSSL"]

# untrusted (Brian Smith's zero-alloc parsing helper) enters the production graph
# only via aws-lc-rs under `--features fips`. ISC, same rationale as above.
[[licenses.exceptions]]
name = "untrusted"
allow = ["ISC"]

# libloading enters the checked graph only via clang-sys <- bindgen, the build-time
# binding generator of the aws-lc `fips` C build. ISC, build-time only, never linked
# into a shipped artifact.
[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
