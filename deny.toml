[advisories]
version = 2
yanked = "deny"
# Policy: fail on vulnerabilities always. For unmaintained/unsound, gate only on
# crates we DIRECTLY chose (`workspace` scope); transitively-pulled dev-tooling
# advisories are NOT hidden — they stay visible in `cargo audit` every run and
# are documented as reviewed/accepted in SUPPLY_CHAIN.md. We do NOT ignore any
# specific advisory ID. The 4 current such advisories (ansi_term, atty x2,
# proc-macro-error2) are dev-only, have no upstream fix, and never ship.
ignore = []
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
