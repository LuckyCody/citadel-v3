[advisories]
version = 2
yanked = "deny"
# Policy: fail on vulnerabilities always. For unmaintained/unsound, gate only on
# crates we DIRECTLY chose (`workspace` scope); transitively-pulled dev-tooling
# advisories are NOT hidden — they stay visible in `cargo audit` every run and
# are documented as reviewed/accepted in SUPPLY_CHAIN.md. We do NOT ignore any
# specific advisory ID. The 4 current such advisories (ansi_term, atty x2,
# proc-macro-error2) are dev-only, have no upstream fix, and never ship.
ignore = []
unmaintained = "workspace"
unsound = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]

# Packet 038 (Citadel-FIPS dep gate): scoped per-crate exceptions for the AWS-LC
# subtree ONLY — the global allowlist above is deliberately unchanged. ISC is a
# permissive MIT-equivalent. The OpenSSL license term (aws-lc-fips-sys) is accepted
# for the opt-in, non-default `fips` build only; its AGPL-compatibility question is
# recorded in SUPPLY_CHAIN.md §AWS-LC and MUST clear legal review before any `fips`
# artifact ships (packet 048). Rationale: SUPPLY_CHAIN.md; program doc:
# factory citadel/fips-backend/SUPPLY_CHAIN.md.
[[licenses.exceptions]]
name = "aws-lc-rs"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-sys"
allow = ["ISC"]

[[licenses.exceptions]]
name = "aws-lc-fips-sys"
allow = ["ISC", "OpenSSL"]

# untrusted (Brian Smith's zero-alloc parsing helper) enters the production graph
# only via aws-lc-rs under `--features fips`. ISC, same rationale as above.
[[licenses.exceptions]]
name = "untrusted"
allow = ["ISC"]

# libloading enters the checked graph only via clang-sys <- bindgen, the build-time
# binding generator of the aws-lc `fips` C build. ISC, build-time only, never linked
# into a shipped artifact.
[[licenses.exceptions]]
name = "libloading"
allow = ["ISC"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
