[package]
name = "citadel-envelope"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Citadel Envelope v2: X25519 + ML-KEM-768 hybrid encryption with AES-256-GCM"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrcord77/rust_citadel"
keywords = ["cryptography", "post-quantum", "encryption", "ml-kem", "hybrid"]
categories = ["cryptography"]

[lib]
name = "citadel_envelope"
path = "src/lib.rs"

[dependencies]
# ML-KEM-768 (FIPS 203) — selected RustCrypto release provider.
# Exact pin with zeroization and system randomness; deterministic access is
# exposed only through the KAT feature for final-standard vectors.
# See PROVIDER_BAKEOFF_2026.md and PROVIDER_DECISION_LOG.md.
ml-kem = { version = "=0.3.2", default-features = false, features = ["getrandom", "zeroize"] }

# X25519 ECDH - classical KEM for hybrid defense-in-depth
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Symmetric cryptography. `zeroize` is enabled down the cipher stack (028-R P3):
# - aes 0.8.4 is ZeroizeOnDrop on ALL backends incl. the x86_64 autodetect wrapper,
#   so the AES round-key schedule (from which the key is recoverable) IS wiped on
#   cipher drop, on unwind too (verified 029-R Q2).
# - aes-gcm + ghash zeroize wipe the TRANSIENT GHASH construction copies.
# - polyval 0.6.2's x86_64 autodetect wrapper stores its backend in a ManuallyDrop
#   union with NO Drop impl, so the RETAINED GHASH H state is NOT wiped on x86 (a
#   polyval limitation). NOTE (030-R R2): this is a GCM tag-forgery primitive under a
#   memory-disclosure precondition — NOT low severity — because Citadel envelopes are
#   deterministically re-openable (K is re-derived per open, not single-use). Fixed
#   upstream in polyval 0.7.3; the close is an aes-gcm 0.10->0.11 bump (pulls the fixed
#   polyval), pending owner go-ahead. See the KEY_LIFECYCLE note in kdf.rs. Features
#   kept: they wipe transients and DO wipe retained state on aarch64+PMULL / force-soft.
aes-gcm = { version = "0.10", features = ["aes", "zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"

# Constant-time operations
subtle = "2.5"

# Secure random number generation
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Memory zeroing for sensitive data
zeroize = { version = "1.7", features = ["derive"] }

# Comparison-only AWS-LC provider. Optional so ordinary workspace tests and
# production builds do not compile it; enable only for the standalone provider bench.
aws-lc-rs = { version = "1.17", features = ["unstable"], optional = true }

[dev-dependencies]
hex = "0.4"
rand = "0.8"
# Re-listed so benchmarks/examples can import these crates directly
aes-gcm = { version = "0.10", features = ["aes"] }
sha2 = "0.10"
# P163: keep Criterion minimal and gated by required-features on bench targets.
criterion = { version = "0.5", default-features = false }
dudect-bencher = "0.6.0"
# Previous ML-KEM provider — kept for comparison benches only.
# See PROVIDER_DECISION_LOG.md for why it was replaced.
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768"] }
# Screening-only fourth candidate: direct deterministic API plus an upstream
# dudect harness. It is not part of production unless every frozen gate passes.
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
# Deterministic mode for Known Answer Tests - NEVER use in production
kat = ["ml-kem/hazmat"]
# Enable criterion benchmarks: cargo bench --features bench
bench = []
# Explicit opt-in for the AWS-LC comparison path. Never selected by default.
aws-lc-comparison = ["dep:aws-lc-rs"]
# Diagnostic/timing helpers (raw component decapsulation for side-channel benches).
# NOT compiled into default/production builds: these expose unguarded intermediate
# KEM material (e.g. raw X25519 output without the contributory check) purely for
# timing isolation. Never enable in production. (020-R hardening.)
timing-diagnostics = []
# Compatibility-only V2 streaming API. New integrations must use stream_v3.
legacy-stream-v2 = []
# Compatibility-only creation of historical envelope v1 fixtures. Default
# production builds can decrypt v1 but cannot create new v1 envelopes.
legacy-envelope-v1 = []
# Enable std features
std = []

[[test]]
name = "streaming"
path = "tests/streaming.rs"
required-features = ["legacy-stream-v2"]

[[test]]
name = "production_mlkem_acvp"
path = "tests/production_mlkem_acvp.rs"
required-features = ["kat"]

[[test]]
name = "migration_v1"
path = "tests/migration_v1.rs"
required-features = ["legacy-envelope-v1"]

[[test]]
name = "v2_vector"
path = "tests/v2_vector.rs"
required-features = ["kat"]

[[bench]]
name = "timing"
harness = false

[[bench]]
name = "timing_sidechannel"
harness = false
required-features = ["timing-diagnostics"]

[[bench]]
name = "mlkem_standalone"
harness = false
required-features = ["aws-lc-comparison"]

[[bench]]
name = "comparative"
harness = false
required-features = ["bench"]

[[example]]
name = "demo"
required-features = ["std"]
