[package]
name = "citadel-envelope"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Citadel Envelope v1: X25519 + ML-KEM-768 hybrid post-quantum encryption with AES-256-GCM"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrcord77/rust_citadel"
keywords = ["cryptography", "post-quantum", "encryption", "ml-kem", "hybrid"]
categories = ["cryptography"]

[lib]
name = "citadel_envelope"
path = "src/lib.rs"

[dependencies]
# ML-KEM-768 (FIPS 203) — PQClean reference implementation.
# Switched from libcrux-ml-kem 0.0.9 after dudect validation found
# key-material-dependent timing in libcrux decapsulation (|t|=19.5).
# PQClean passed 3/3 independent key-A-vs-key-B runs (|t| < 4.5).
# See PROVIDER_DECISION_LOG.md for rollback instructions.
# Exact pin: any cryptographic provider upgrade must be revalidated
# with the dudect timing suite.
pqcrypto-mlkem = { version = "=0.1.1", default-features = false }
pqcrypto-traits = { version = "=0.3.5", default-features = false }

# X25519 ECDH - classical KEM for hybrid defense-in-depth
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Symmetric cryptography
aes-gcm = { version = "0.10", features = ["aes"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"

# Constant-time operations
subtle = "2.5"

# Secure random number generation
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"

# Memory zeroing for sensitive data
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
rand = "0.8"
# Re-listed so benchmarks/examples can import these crates directly
aes-gcm = { version = "0.10", features = ["aes"] }
sha2 = "0.10"
# P163: keep Criterion minimal and gated by required-features on bench targets.
criterion = { version = "0.5", default-features = false }
dudect-bencher = "0.6.0"
# Previous ML-KEM provider — kept for comparison benches only.
# See PROVIDER_DECISION_LOG.md for why it was replaced.
libcrux-ml-kem = { version = "=0.0.9", default-features = false, features = ["mlkem768"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-lc-rs = { version = "1.17", features = ["unstable"] }

[features]
default = []
# Deterministic mode for Known Answer Tests - NEVER use in production
kat = []
# Enable criterion benchmarks: cargo bench --features bench
bench = []
# Enable std features
std = []

[[bench]]
name = "timing"
harness = false

[[bench]]
name = "timing_sidechannel"
harness = false

[[bench]]
name = "mlkem_standalone"
harness = false

[[bench]]
name = "comparative"
harness = false
required-features = ["bench"]

[[example]]
name = "demo"
required-features = ["std"]
