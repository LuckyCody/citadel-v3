# =============================================================================
# Citadel — Development Compose
#
# For local development only. Uses plaintext keys, memory replay, demo seeds.
# DO NOT use this in staging or production.
#
# Start:   CITADEL_ENV=development CITADEL_ALLOW_PLAINTEXT_KEYS=1 docker compose up -d
# Health:  curl http://localhost:8443/health
#
# For production, use: deploy/docker/docker-compose.yml
# =============================================================================

services:
  citadel:
    build:
      context: .
      dockerfile: Dockerfile
    image: citadel:v3-dev
    container_name: citadel-dev
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      CITADEL_PORT: "8443"
      CITADEL_DATA_DIR: /data
      CITADEL_ENV: development
      CITADEL_ALLOW_PLAINTEXT_KEYS: "1"
      CITADEL_SEED_DEMO: "true"
    volumes:
      - citadel_dev_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  citadel_dev_data:
