[package]
name = "citadel-api"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "REST API layer for the Citadel post-quantum encryption ecosystem"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrcord77/citadel-v3"
keywords = ["cryptography", "post-quantum", "encryption", "api", "rest"]
categories = ["cryptography", "web-programming::http-server"]

[[bin]]
name = "citadel-api"
path = "src/main.rs"

[[bin]]
name = "hash-apikey"
path = "src/hash_apikey.rs"

[features]
default = []
# Enable Redis-backed distributed replay store.
# Must match the feature enabled in citadel-keystore.
# Build: cargo build --features redis-backend
redis-backend = ["citadel-keystore/redis-backend"]
# FIPS backend (packet 047): forwarding only — the API performs no crypto itself.
# Selects the AWS-LC FIPS module inside citadel-envelope and makes /health report
# the crypto backend + module status. Wording is bound by the CLAIM_EVIDENCE_MATRIX
# FIPS-backend section: the module is SUBMITTED for FIPS 140-3 validation (CMVP
# review pending), NOT validated.
fips = ["citadel-envelope/fips"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
citadel-envelope = { path = "../citadel-envelope" }
citadel-keystore = { path = "../citadel-keystore" }
citadel-core = { path = "../citadel-core" }
# P373: CNA assertion API routes require citadel-signer for CitadelAssertion type
citadel-signer = { path = "../citadel-signer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
# HMAC-SHA256 for API key hashing with server-side secret (P021 fix)
hmac = "0.12"
subtle = "2"
hex = "0.4"
getrandom = "0.2"
zeroize = "1.7"

[dev-dependencies]
# In-process HTTP testing via tower::ServiceExt
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
proptest = "1.8.0"
