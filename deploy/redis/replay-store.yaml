# Citadel V3 — Redis Replay Store (Kubernetes)
# ─────────────────────────────────────────────────────────────────────────────
# In-cluster Redis for distributed nonce replay protection.
# For production, consider Redis Cluster or a managed Redis service
# (ElastiCache, Cloud Memorystore, etc.).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: citadel-redis
  labels:
    app: citadel-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: citadel-redis
  template:
    metadata:
      labels:
        app: citadel-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""              # Disable persistence — replay store is ephemeral by design
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: citadel-redis
  labels:
    app: citadel-redis
spec:
  selector:
    app: citadel-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
