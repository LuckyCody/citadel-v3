# Citadel V3 — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# REQUIRED before starting:
#   export CITADEL_MASTER_KEY=$(openssl rand -hex 32)
# Or store in .env (gitignored) and reference with env_file below.
#
# Start:  docker compose up -d
# Doctor: docker compose exec citadel citadel doctor
# Logs:   docker compose logs -f citadel

version: "3.9"

services:
  citadel:
    image: citadel:v3
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"    # Bind to loopback only; put nginx/caddy in front
    volumes:
      - citadel_data:/data                          # P117: matches Dockerfile /data (chowned to citadel)
    environment:
      CITADEL_ENV: production
      CITADEL_PORT: "8443"
      CITADEL_DATA_DIR: /data                       # P117: consistent with Dockerfile ENV and volume mount
      # DO NOT commit CITADEL_MASTER_KEY or CITADEL_API_KEY_HASH to git.
      # Use Docker Secrets or .env file (gitignored):
      CITADEL_MASTER_KEY: "${CITADEL_MASTER_KEY:?CITADEL_MASTER_KEY must be set}"
      # API key hash — HMAC-SHA256(api_key, CITADEL_MASTER_KEY). Generate with:
      #   CITADEL_MASTER_KEY=<key> cargo run --bin hash-apikey -- --generate
      CITADEL_API_KEY_HASH: "${CITADEL_API_KEY_HASH:?CITADEL_API_KEY_HASH must be set}"
      CITADEL_REPLAY_STORE: redis
      CITADEL_REDIS_URL: redis://redis:6379
      CITADEL_REPLAY_FAIL_CLOSED: "true"
      CITADEL_RATE_LIMIT_RPS: "100"
      CITADEL_RATE_LIMIT_BURST: "200"
      # Explicitly unset — plaintext keys must not be allowed in production
      CITADEL_ALLOW_PLAINTEXT_KEYS: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Run as the image's own redis user (uid 999) directly: the official
    # entrypoint normally starts as root and drops to this user via setpriv,
    # which needs CAP_SETUID/CAP_SETGID — capabilities cap_drop: ALL below
    # removes. Skipping the entrypoint's own privilege-drop step means no
    # capability needs adding back (found live: cap_drop: ALL + the
    # unmodified image crash-looped with "setpriv: setresuid failed:
    # Operation not permitted" — this compose file had never actually been
    # run end to end before).
    user: "999:1000"
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL

volumes:
  citadel_data:
    driver: local
  redis_data:
    driver: local
