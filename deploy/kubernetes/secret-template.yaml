# Citadel V3 — Kubernetes Secret Template
# ─────────────────────────────────────────────────────────────────────────────
# DO NOT commit this file with a real master key.
# Generate a key: openssl rand -hex 32
# Encode for Kubernetes: echo -n "<your-key>" | base64
#
# Apply:  kubectl apply -f secret-template.yaml
# Verify: kubectl get secret citadel-secrets -o jsonpath='{.data.master-key}' | base64 -d | wc -c
#         (should print 64)
#
# For production use a secrets manager:
#   - AWS Secrets Manager + external-secrets-operator
#   - HashiCorp Vault + vault-agent-injector
#   - GCP Secret Manager + Workload Identity

apiVersion: v1
kind: Secret
metadata:
  name: citadel-secrets
  labels:
    app: citadel
type: Opaque
data:
  # Replace with: echo -n "$(openssl rand -hex 32)" | base64
  master-key: REPLACE_WITH_BASE64_ENCODED_64_HEX_CHAR_KEY

  # Optional: API authentication key hash
  # Replace with: echo -n "$(citadel hash-apikey <your-api-key>)" | base64
  # HMAC-SHA256(api_key, CITADEL_MASTER_KEY) — generated by hash-apikey binary
  # Step 1: CITADEL_MASTER_KEY=<hex> cargo run --bin hash-apikey -- --generate
  # Step 2: echo -n "<HMAC-SHA256-hash>" | base64
  api-key-hash: REPLACE_WITH_BASE64_ENCODED_HMAC_SHA256_HASH
